<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d7a">
<title>Tableau de bord PEA</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--mute:#66788a;--line:#e1e6ea;--up:#0d7a4e;--dn:#c23b32;--acc:#1f4d7a;--alt:#f6f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#0e141a;--card:#161e26;--ink:#e8eef3;--mute:#8d9cab;--line:#26313b;--up:#3ccf91;--dn:#ff6b62;--acc:#6aa8e6;--alt:#1a232c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 14px}
h1{font-size:13px;font-weight:600;color:var(--mute);margin:0}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.up{color:var(--up)}.dn{color:var(--dn)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 14px;padding:0 14px;scrollbar-width:none}
nav button{white-space:nowrap;border-radius:99px;padding:7px 14px;color:var(--mute)}
nav button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.k b{display:block;font-size:18px;margin-top:2px}.k span{color:var(--mute);font-size:12.5px}
.k small{display:block;font-size:12px;margin-top:1px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
h2{font-size:15px;margin:0 0 10px}
.cv{position:relative;height:260px}
.row2{display:grid;gap:14px}@media(min-width:720px){.row2{grid-template-columns:1fr 1fr}}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
th{color:var(--mute);font-weight:500;cursor:pointer;border-bottom:1px solid var(--line);background:var(--card)}
tbody tr:nth-child(even){background:var(--alt)}
tbody tr{background:var(--card)}tbody tr:nth-child(even){background:var(--alt)}
.empty{text-align:center;padding:48px 16px}.empty p{color:var(--mute);max-width:44ch;margin:8px auto 16px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:460px;width:calc(100% - 28px)}
dialog::backdrop{background:#0007}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input:not([type=file]),select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
tbody tr[data-i]{cursor:pointer}h3{font-size:14px;margin:14px 0 0}.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Valeur du PEA</h1>
    <div class="big" id="tot">–</div>
    <div class="sub" id="sub"></div><div class="sub" id="st"></div>
  </div>
  <div class="bar" style="margin:0"><button id="add">+ Opération</button><button id="cfg">Réglages</button></div>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="view"></div>
</main>

<dialog id="dlg">
  <form method="dialog">
    <h2>Réglages</h2>
    <h3>Synchronisation Supabase</h3>
    <label for="sbu">Adresse du projet</label><input id="sbu" type="url" placeholder="https://xxxx.supabase.co">
    <label for="sbk">Clé publique (anon / publishable)</label><input id="sbk" type="text" autocomplete="off">
    <p class="hint">Jamais la clé « service_role » : cette page est publique.</p>
    <label for="sbe">E-mail</label><input id="sbe" type="email" autocomplete="email">
    <div class="bar"><button type="button" id="sbsend">Recevoir un code</button><button type="button" id="sbout">Se déconnecter</button></div>
    <div id="sbcode" hidden><label for="sbc">Code reçu par e-mail</label><input id="sbc" inputmode="numeric" autocomplete="one-time-code"><div class="bar"><button type="button" id="sbok">Valider le code</button></div></div>
    <p class="hint" id="sbst"></p>
    <h3>Données</h3>
    <label for="csv">Importer un export CSV</label>
    <input type="file" id="csv" accept=".csv,text/csv">
    <div class="bar"><button type="button" id="exp">Exporter en CSV</button></div>
    <p class="hint">Sans connexion, les données restent dans ce navigateur.</p>
    <h3>Cours en direct</h3>
    <label for="url">Adresse du script Google</label>
    <input type="url" id="url" placeholder="https://script.google.com/macros/s/…/exec">
    <p class="hint">Sans adresse, les valeurs sont calculées au prix de revient (PRU).</p>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:space-between">
      <button type="button" id="reset">Effacer les données locales</button>
      <button value="ok">Fermer</button>
    </div>
  </form>
</dialog>

<dialog id="op">
  <form id="opf" method="dialog">
    <h2 id="opt">Nouvelle opération</h2>
    <label for="o_type">Type</label>
    <select id="o_type"><option value="ACHAT">Achat</option><option value="VENTE">Vente</option><option value="DIVIDENDE">Dividende</option><option value="APPORT">Apport</option><option value="RETRAIT">Retrait</option><option value="SPLIT">Split</option></select>
    <label for="o_d">Date et heure</label><input type="datetime-local" step="1" id="o_d" required>
    <div data-f="nom"><label for="o_nom">Valeur</label><input id="o_nom" list="dl_nom" autocomplete="off"><datalist id="dl_nom"></datalist>
    <label for="o_tk">Ticker</label><input id="o_tk" autocomplete="off"></div>
    <label for="o_q" id="l_q">Quantité</label><input type="number" step="any" inputmode="decimal" id="o_q" required>
    <div data-f="p"><label for="o_p" id="l_p">Prix unitaire (€)</label><input type="number" step="any" inputmode="decimal" id="o_p"></div>
    <div data-f="fr"><label for="o_c">Commission (€)</label><input type="number" step="any" inputmode="decimal" id="o_c"><label for="o_t">TTF (€)</label><input type="number" step="any" inputmode="decimal" id="o_t"></div>
    <div data-f="dv"><label for="o_r">Retenue à la source (€)</label><input type="number" step="any" inputmode="decimal" id="o_r"><label for="o_b">Remboursement de capital (€)</label><input type="number" step="any" inputmode="decimal" id="o_b"></div>
    <div data-f="sp"><label for="o_ro">Rompu versé (€)</label><input type="number" step="any" inputmode="decimal" id="o_ro"><label for="o_dr">Date de versement du rompu</label><input type="datetime-local" step="1" id="o_dr"></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:space-between;flex-wrap:wrap">
      <button type="button" id="o_del" hidden>Supprimer</button>
      <span style="flex:1"></span><button type="button" id="o_no">Annuler</button><button value="ok" id="o_ok">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const nf=(d)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fE=(v,d=2)=>isFinite(v)?nf(d).format(v)+' €':'–';
const fP=v=>isFinite(v)?(v<0?'−':'+')+nf(2).format(Math.abs(v))+' %':'–';
const fS=(v,d=2)=>(v<0?'−':'+')+nf(d).format(Math.abs(v))+' €';
const cl=v=>Math.abs(v)<.005?'':v>0?'up':'dn';
const ar=v=>Math.abs(v)<.005?'▬':v>0?'▲':'▼';
const r2=x=>Math.round(Number((x*100).toFixed(6)))/100;
const LS={g(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- Données ---------- */
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  const h=rows.shift();
  return rows.filter(x=>x.length>1).map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]);return o});
}
function norm(o,i){
  const n=k=>parseFloat(o[k])||0,D=s=>new Date(String(s).replace(' ','T'));
  return{i,nom:o.Nom,type:o.Type,tk:o.Ticker,q:n('Quantité'),p:n('Prix Unitaire (€)'),f:n('Frais Totaux (€)'),c:n('Commission (€)'),
    rompu:n('Rompu'),ret:n('Retenue_Source_Etrangere'),remb:n('Remboursement_Capital'),arr:n('Arrondi_Courtier'),
    d:D(o.Date_Heure),dr:D(o.Date_Rompus||o.Date_Heure)};
}

/* ---------- Calculs (même logique que app_perso.py) ---------- */
function compute(tx,prices){
  const now=new Date(),by={},pos=[];let divTot=0,fees=0,cost=0,real=0;
  tx.forEach(t=>{if(t.type=='ACHAT'||t.type=='VENTE')fees+=t.f;
    if(t.type!='APPORT'&&t.type!='RETRAIT')(by[t.tk]=by[t.tk]||[]).push(t)});
  const key=t=>{const d=new Date(t.d);if(t.type=='SPLIT')d.setHours(0,0,0,0);return d.getTime()};
  for(const tk in by){
    const g=by[tk].sort((a,b)=>key(a)-key(b));
    let sh=0,inv=0,ach=0,div=0,rl=0;const nom=g[g.length-1].nom;
    for(const t of g){
      if(t.type=='ACHAT'){sh+=t.q;inv+=t.q*t.p+t.f;ach+=t.q*t.p+t.f}
      else if(t.type=='VENTE'){const rev=t.q*t.p-t.f;if(sh>0){const pru=inv/sh;rl+=rev-t.q*pru;sh-=t.q;inv=sh*pru}}
      else if(t.type=='SPLIT'){if(sh>0)sh=Math.trunc(sh*t.q+1e-9);if(t.rompu>0&&t.dr<=now)div+=t.rompu}
      else if(t.type=='DIVIDENDE'){div+=t.p-t.ret-t.c+t.arr;if(t.remb>0){inv=Math.max(0,inv-t.remb);ach=Math.max(0,ach-t.remb)}}
    }
    if(sh>1e-4||Math.abs(rl)>.001||div>.001||ach>0){
      const open=sh>1e-4,pru=open?inv/sh:0,pr=prices[tk],px=(pr&&pr.p)||pru,val=open?sh*px:0,lat=open?val-inv:0,tot=lat+div+rl;
      const base=open?(inv>0?inv:1):(ach>0?ach:1);
      pos.push({nom,tk,sh,open,pru,px,val,inv,lat,latP:open&&inv>0?lat/inv*100:0,div,rl,tot,perf:tot/base*100,
        day:open&&pr&&pr.pc?(pr.p-pr.pc)*sh:0,live:!!(pr&&pr.p)});
      divTot+=div;real+=rl;cost+=ach;
    }
  }
  let cash=0;
  tx.map(t=>({t,k:t.type=='SPLIT'?t.dr:t.d})).sort((a,b)=>a.k-b.k).forEach(({t})=>{
    if(t.type=='APPORT')cash=r2(cash+t.q);
    else if(t.type=='RETRAIT')cash=r2(cash-t.q);
    else if(t.type=='ACHAT')cash=r2(cash-r2(t.q*t.p+t.f));
    else if(t.type=='VENTE')cash=r2(cash+r2(t.q*t.p-t.f));
    else if(t.type=='DIVIDENDE')cash=r2(cash+t.p-t.ret-t.c+t.remb+t.arr);
    else if(t.type=='SPLIT'&&t.rompu>0)cash=r2(cash+t.rompu);
  });
  const apports=tx.reduce((s,t)=>s+(t.type=='APPORT'?t.q:t.type=='RETRAIT'?-t.q:0),0);
  const valeur=pos.reduce((s,p)=>s+p.val,0),day=pos.reduce((s,p)=>s+p.day,0);
  return{pos,cash,apports,valeur,total:valeur+cash,gain:valeur+cash-apports,divTot,fees,real,day,
    anyLive:pos.some(p=>p.open&&p.live)};
}

/* ---------- État ---------- */
let S={raw:[],synced:false,editing:null,tx:[],prices:LS.g('prices')||{},url:LS.g('url')||'',tab:'ov',sort:{k:'val',d:-1}},R=null,CH={};
const COLS=['Nom','Type','Rompu','Ticker','Quantité','TTF (€)','Date_Heure','Date_Rompus','Arrondi_Courtier','Commission (€)','Frais Totaux (€)','Prix Unitaire (€)','Remboursement_Capital','Retenue_Source_Etrangere'];
const TXT=['Nom','Type','Ticker','Date_Heure','Date_Rompus'];
function toRaw(o){const r={};COLS.forEach(k=>r[k]=TXT.includes(k)?(o[k]||null):(parseFloat(o[k])||0));if(!r.Date_Rompus)r.Date_Rompus=r.Date_Heure;return r}
function rebuild(){S.tx=S.raw.map(norm).filter(x=>x.type&&!isNaN(x.d));R=compute(S.tx,S.prices)}
function load(){let raw=LS.g('raw');if(!raw){const t=LS.g('csv');raw=t?parseCSV(t).map(toRaw):[]}S.raw=raw;rebuild()}
const st=m=>{$('#st').textContent=m||''};
/* ---------- Supabase (API REST, connexion par code e-mail) ---------- */
const SB={get s(){return LS.g('sb')||{}},set s(v){LS.s('sb',v)}};
const sess=j=>{SB.s={...SB.s,access:j.access_token,refresh:j.refresh_token,uid:j.user.id,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)}};
async function raw(path,o={},tok){const s=SB.s;const hd={apikey:s.key,'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{}),...(o.headers||{})};
  const r=await fetch(s.url+path,{...o,headers:hd});const t=await r.text();if(!r.ok)throw new Error(t.slice(0,160)||r.status);return t?JSON.parse(t):null}
async function ensure(){let s=SB.s;if(s.access&&s.exp>Date.now()/1000+60)return s.access;
  try{sess(await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh})}))}
  catch{SB.s={...s,access:null,refresh:null,uid:null};throw new Error('session expirée, reconnecte-toi dans Réglages')}
  return SB.s.access}
const connected=()=>!!(SB.s.url&&SB.s.refresh);
async function pull(){if(!connected())return;
  try{const j=await raw(`/rest/v1/app_storage?select=value&key=eq.transactions&user_id=eq.${SB.s.uid}`,{},await ensure());
    S.synced=true;if(j.length&&Array.isArray(j[0].value)){S.raw=j[0].value;LS.s('raw',S.raw);rebuild();draw();refreshPrices()}st('Synchronisé avec Supabase')}
  catch(e){S.synced=false;st('Synchronisation impossible : '+e.message)}}
async function save(){LS.s('raw',S.raw);if(!connected())return;
  if(!S.synced)return st('Enregistré sur cet appareil seulement : la lecture en ligne a échoué, écriture bloquée par sécurité');
  try{await raw('/rest/v1/app_storage?on_conflict=user_id,key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({user_id:SB.s.uid,key:'transactions',value:S.raw})},await ensure());st('Enregistré dans Supabase ✓')}
  catch(e){st('Échec de l’enregistrement en ligne : '+e.message)}}
/* ---------- Saisie d'opérations ---------- */
const $v=id=>$(id).value,nn=id=>parseFloat($v(id))||0;
function fields(){const t=$v('#o_type'),a=t=='ACHAT'||t=='VENTE',ap=t=='APPORT'||t=='RETRAIT',sp=t=='SPLIT';
  const show=(k,b)=>document.querySelector(`#op [data-f=${k}]`).hidden=!b;
  show('nom',!ap);show('p',!ap&&!sp);show('fr',a);show('dv',t=='DIVIDENDE');show('sp',sp);
  $('#l_q').textContent=ap?'Montant (€)':sp?'Ratio (× nombre de titres)':t=='DIVIDENDE'?'Titres détenus':'Quantité';
  $('#l_p').textContent=t=='DIVIDENDE'?'Montant du dividende (€)':'Prix unitaire (€)'}
const dtl=s=>s?String(s).replace(' ','T'):'';
function openOp(i){S.editing=i==null?null:i;const r=i==null?null:S.raw[i];
  $('#opt').textContent=r?'Modifier l’opération':'Nouvelle opération';$('#o_del').hidden=!r;
  const names=[...new Set(S.raw.map(x=>x.Nom).filter(n=>n&&n!='Compte Courant'))].sort();$('#dl_nom').innerHTML=names.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
  const g=k=>r&&r[k]!=null?r[k]:'';const z=k=>r&&r[k]?r[k]:'';
  $('#o_type').value=r?r.Type:'ACHAT';$('#o_d').value=r?dtl(r.Date_Heure):new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,19);
  $('#o_nom').value=g('Nom');$('#o_tk').value=g('Ticker');$('#o_q').value=g('Quantité');$('#o_p').value=g('Prix Unitaire (€)');
  $('#o_c').value=z('Commission (€)');$('#o_t').value=z('TTF (€)');$('#o_r').value=z('Retenue_Source_Etrangere');$('#o_b').value=z('Remboursement_Capital');
  $('#o_ro').value=z('Rompu');$('#o_dr').value=r?dtl(r.Date_Rompus):'';fields();$('#op').showModal()}
function readOp(){const t=$v('#o_type'),a=t=='ACHAT'||t=='VENTE',ap=t=='APPORT'||t=='RETRAIT',sp=t=='SPLIT',dv=t=='DIVIDENDE';
  const d=$v('#o_d'),dh=d.replace('T',' ')+(d.length==16?':00':'');
  if(!d||(!ap&&(!$v('#o_nom').trim()||!$v('#o_tk').trim())))return null;
  const r={};COLS.forEach(k=>r[k]=TXT.includes(k)?null:0);
  Object.assign(r,{Type:t,Date_Heure:dh,Nom:ap?'Compte Courant':$v('#o_nom').trim(),Ticker:ap?'APPORT':$v('#o_tk').trim().toUpperCase(),'Quantité':nn('#o_q'),
    'Prix Unitaire (€)':ap?1:sp?0:nn('#o_p'),Date_Rompus:dh});
  if(a){r['Commission (€)']=nn('#o_c');r['TTF (€)']=nn('#o_t');r['Frais Totaux (€)']=Number((nn('#o_c')+nn('#o_t')).toFixed(6))}
  if(dv){r.Retenue_Source_Etrangere=nn('#o_r');r['Frais Totaux (€)']=nn('#o_r');r.Remboursement_Capital=nn('#o_b')}
  if(sp){r.Rompu=nn('#o_ro');if($v('#o_dr')){const x=$v('#o_dr');r.Date_Rompus=x.replace('T',' ')+(x.length==16?':00':'')}}
  return r}
async function commit(){rebuild();draw();await save()}
async function refreshPrices(){
  if(!S.url||!S.tx.length)return;
  const tks=compute(S.tx,{}).pos.filter(p=>p.open).map(p=>p.tk);
  try{const r=await fetch(S.url+(S.url.includes('?')?'&':'?')+'t='+encodeURIComponent(tks.join(',')));
    const j=await r.json();S.prices=j;LS.s('prices',j);LS.s('pricesAt',Date.now());R=compute(S.tx,S.prices);draw()}
  catch(e){$('#sub').textContent='Cours indisponibles (script Google injoignable)'}
}

/* ---------- Affichage ---------- */
const TABS=[['ov','Vue d’ensemble'],['pos','Positions'],['div','Dividendes'],['app','Apports'],['hist','Historique']];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function chart(id,cfg){if(CH[id])CH[id].destroy();const el=document.getElementById(id);if(!el||!window.Chart)return;
  Chart.defaults.color=css('--mute');Chart.defaults.font.family='system-ui,sans-serif';CH[id]=new Chart(el,cfg)}
function kpi(l,v,s,c){return`<div class="k"><span>${l}</span><b>${v}</b>${s?`<small class="${c||''}">${s}</small>`:''}</div>`}
function table(cols,rows,sk){
  const s=S.sort;if(sk){rows=[...rows].sort((a,b)=>(a[s.k]>b[s.k]?1:-1)*s.d)}
  return`<div class="tw"><table><thead><tr>${cols.map(c=>`<th ${sk?`data-k="${c.k}"`:''}>${c.h}${sk&&s.k==c.k?(s.d>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr${r.i!=null?` data-i="${r.i}"`:''}>${cols.map(c=>`<td class="${c.c?cl(r[c.k]):''}">${c.f(r[c.k],r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const sgn=(v,d=2)=>`${ar(v)} ${fS(v,d)}`;

function draw(){
  const v=$('#view');
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k==S.tab}">${l}</button>`).join('');
  if(!S.tx.length){$('#tot').textContent='–';$('#sub').textContent='';
    v.innerHTML=`<section class="empty"><h2>Aucune donnée</h2><p>Importe l'export CSV de tes transactions pour afficher ton portefeuille. Tout reste dans ce navigateur.</p><button id="go">Importer mon CSV</button></section>`;
    $('#go').onclick=()=>$('#dlg').showModal();return}
  $('#tot').textContent=fE(R.total);
  const at=LS.g('pricesAt');
  $('#sub').innerHTML=`<span class="${cl(R.gain)}">${sgn(R.gain)}</span> depuis le début`+(R.anyLive?` · <span class="${cl(R.day)}">${sgn(R.day)}</span> aujourd'hui`:' · cours non connectés, valeur au PRU')
    +(at&&R.anyLive?` · cours de ${new Date(at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:'');
  const P=R.pos,open=P.filter(p=>p.open);
  if(S.tab=='ov'){
    v.innerHTML=`<div class="grid">
      ${kpi('Valeur des titres',fE(R.valeur))}${kpi('Liquidités',fE(R.cash))}${kpi('Apports',fE(R.apports,0))}
      ${kpi('Plus-value totale',fS(R.gain),fP(R.apports?R.gain/R.apports*100:0),cl(R.gain))}
      ${kpi('Dividendes reçus',fE(R.divTot),R.apports?nf(2).format(R.divTot/R.apports*100)+' % des apports':'')}
      ${kpi('Frais de courtage',fE(R.fees),R.gain>0?nf(2).format(R.fees/R.gain*100)+' % de la plus-value':'','dn')}</div>
      <div class="row2"><section><h2>Répartition</h2><div class="cv"><canvas id="c1"></canvas></div></section>
      <section><h2>Plus-value par ligne (top et flop)</h2><div class="cv"><canvas id="c2"></canvas></div></section></div>`;
    const top=[...P].sort((a,b)=>b.val-a.val).filter(p=>p.val>0),pal=i=>`hsl(${(i*137)%360} 55% 55%)`;
    chart('c1',{type:'doughnut',data:{labels:top.map(p=>p.nom),datasets:[{data:top.map(p=>p.val),backgroundColor:top.map((_,i)=>pal(i)),borderColor:css('--card'),borderWidth:2}]},
      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label} : ${fE(c.parsed)} (${nf(1).format(c.parsed/R.valeur*100)} %)`}}}}});
    const s=[...P].sort((a,b)=>b.tot-a.tot),b=[...s.slice(0,6),...s.slice(-6)].filter((p,i,a)=>a.indexOf(p)==i);
    chart('c2',{type:'bar',data:{labels:b.map(p=>p.nom),datasets:[{data:b.map(p=>p.tot),backgroundColor:b.map(p=>p.tot>=0?css('--up'):css('--dn')),borderRadius:4}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fS(c.parsed.x)}}},scales:{x:{grid:{color:css('--line')}},y:{grid:{display:false}}}}});
  }
  else if(S.tab=='pos'){
    const cols=[{k:'nom',h:'Valeur',f:x=>x},{k:'sh',h:'Qté',f:x=>nf(x%1?4:0).format(x)},{k:'pru',h:'PRU',f:x=>fE(x,3)},
      {k:'px',h:'Cours',f:x=>fE(x,3)},{k:'val',h:'Valeur',f:x=>fE(x)},{k:'lat',h:'Gain latent',c:1,f:(x,r)=>`${ar(x)} ${fS(x)}<br><small>${fP(r.latP)}</small>`},
      {k:'div',h:'Dividendes',f:x=>fE(x)},{k:'rl',h:'Réalisé',c:1,f:x=>sgn(x)},{k:'perf',h:'Perf. totale',c:1,f:x=>`${ar(x)} ${fP(x)}`}];
    v.innerHTML=`<section><h2>Positions détenues (${open.length})</h2>${table(cols,open,1)}</section>`+
      (P.length>open.length?`<section><h2>Lignes soldées</h2>${table(cols.filter(c=>['nom','div','rl','perf'].includes(c.k)),P.filter(p=>!p.open),1)}</section>`:'');
  }
  else if(S.tab=='div'){
    const y={};S.tx.filter(t=>t.type=='DIVIDENDE').forEach(t=>{const k=t.d.getFullYear();y[k]=(y[k]||0)+t.p-t.ret-t.c+t.arr});
    const ys=Object.keys(y).sort();
    v.innerHTML=`<section><h2>Dividendes nets par année</h2><div class="cv"><canvas id="c3"></canvas></div></section>
      <section><h2>Par ligne</h2>${table([{k:'nom',h:'Valeur',f:x=>x},{k:'div',h:'Dividendes nets',f:x=>fE(x)}],P.filter(p=>p.div>0),1)}</section>`;
    chart('c3',{type:'bar',data:{labels:ys,datasets:[{data:ys.map(k=>y[k]),backgroundColor:css('--acc'),borderRadius:4}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fE(c.parsed.y)}}},scales:{y:{grid:{color:css('--line')}},x:{grid:{display:false}}}}});
  }
  else if(S.tab=='app'){
    let c=0;const a=S.tx.filter(t=>t.type=='APPORT'||t.type=='RETRAIT').sort((x,z)=>x.d-z.d).map(t=>{c+=t.type=='APPORT'?t.q:-t.q;return{x:t.d,y:c}});
    v.innerHTML=`<section><h2>Évolution des apports cumulés</h2><div class="cv"><canvas id="c4"></canvas></div></section>
      <div class="grid" style="margin-top:14px">${kpi('Total versé',fE(R.apports,0))}${kpi('Nombre de versements',String(a.length))}${kpi('Versement moyen',fE(a.length?R.apports/a.length:0,0))}</div>`;
    chart('c4',{type:'line',data:{labels:a.map(p=>p.x.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})),datasets:[{data:a.map(p=>p.y),stepped:true,fill:true,borderColor:css('--acc'),borderWidth:2,pointRadius:0,
      backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,css('--acc')+'55');g.addColorStop(1,css('--acc')+'00');return g}}]},
      options:{maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fE(c.parsed.y,0)}}},scales:{y:{grid:{color:css('--line')}},x:{grid:{display:false},ticks:{maxTicksLimit:6}}}}});
  }
  else{
    const rows=[...S.tx].sort((a,b)=>b.d-a.d).map(t=>({...t,ds:t.d.toLocaleDateString('fr-FR'),mt:t.type=='ACHAT'?-(t.q*t.p+t.f):t.type=='VENTE'?t.q*t.p-t.f:t.type=='DIVIDENDE'?t.p-t.ret-t.c+t.arr:t.type=='APPORT'?t.q:t.type=='RETRAIT'?-t.q:0}));
    v.innerHTML=`<section><h2>Historique (${rows.length} opérations)</h2>${table([{k:'ds',h:'Date',f:x=>x},{k:'type',h:'Type',f:x=>x.charAt(0)+x.slice(1).toLowerCase()},{k:'nom',h:'Valeur',f:x=>x},
      {k:'q',h:'Qté',f:x=>nf(x%1?4:0).format(x)},{k:'f',h:'Frais',f:x=>fE(x)},{k:'mt',h:'Montant',c:1,f:x=>fS(x)}],rows,0)}</section>`;
  }
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-i]');if(tr){openOp(+tr.dataset.i);return}
  const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;draw();return}
  const h=e.target.closest('th[data-k]');if(h){const k=h.dataset.k;S.sort={k,d:S.sort.k==k?-S.sort.d:-1};draw()}
});
$('#cfg').onclick=()=>{$('#url').value=S.url;const s=SB.s;$('#sbu').value=s.url||'';$('#sbk').value=s.key||'';$('#sbe').value=s.email||'';$('#sbst').textContent=connected()?'Connecté ('+(s.email||'')+')':'';$('#dlg').showModal()};
$('#csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;S.raw=parseCSV(await f.text()).map(toRaw);LS.s('raw',S.raw);rebuild();draw();refreshPrices();$('#dlg').close();
  if(connected()&&S.synced&&confirm('Envoyer ces données vers Supabase ? Cela remplace les transactions en ligne.'))save()};
$('#add').onclick=()=>openOp(null);$('#o_type').onchange=fields;$('#o_no').onclick=()=>$('#op').close();
$('#o_nom').onchange=()=>{const m=S.raw.find(x=>x.Nom==$v('#o_nom')&&x.Ticker&&x.Ticker!='APPORT');if(m)$('#o_tk').value=m.Ticker};
$('#opf').onsubmit=async e=>{const r=readOp();if(!r){e.preventDefault();return alert('Date, valeur et ticker sont obligatoires.')}
  if(S.editing!=null)S.raw[S.editing]=r;else S.raw.push(r);await commit()};
$('#o_del').onclick=async()=>{if(confirm('Supprimer cette opération ?')){S.raw.splice(S.editing,1);$('#op').close();await commit()}};
$('#exp').onclick=()=>{const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\uFEFF'+COLS.join(',')+'\n'+S.raw.map(r=>COLS.map(k=>q(r[k])).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='transactions_'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
$('#sbsend').onclick=async()=>{SB.s={...SB.s,url:$v('#sbu').trim().replace(/\/$/,''),key:$v('#sbk').trim(),email:$v('#sbe').trim()};
  try{await raw('/auth/v1/otp',{method:'POST',body:JSON.stringify({email:SB.s.email,create_user:false})});$('#sbcode').hidden=false;$('#sbst').textContent='Code envoyé : vérifie ta boîte mail (et les spams).'}
  catch(e){$('#sbst').textContent='Erreur : '+e.message}};
$('#sbok').onclick=async()=>{try{sess(await raw('/auth/v1/verify',{method:'POST',body:JSON.stringify({type:'email',email:SB.s.email,token:$v('#sbc').trim()})}));
  $('#sbcode').hidden=true;$('#sbst').textContent='Connecté ✓';await pull()}catch(e){$('#sbst').textContent='Code invalide ou expiré : '+e.message}};
$('#sbout').onclick=()=>{SB.s={...SB.s,access:null,refresh:null,uid:null};S.synced=false;$('#sbst').textContent='Déconnecté.';st('')};
$('#dlg').addEventListener('close',()=>{const u=$('#url').value.trim();if(u!==S.url){S.url=u;LS.s('url',u);refreshPrices()}});
$('#reset').onclick=()=>{if(confirm('Effacer toutes les données de ce navigateur ?')){['csv','raw','prices','pricesAt'].forEach(k=>localStorage.removeItem(k));S.prices={};load();draw();$('#dlg').close()}};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
load();draw();refreshPrices();pull();
</script>
</body>
</html>
