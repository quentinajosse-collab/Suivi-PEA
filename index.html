<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Mon Patrimoine</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#0284c7;--up:#0d7a4e;--dn:#c23b32}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--txt:#e5edf8;--mut:#94a3b8;--line:#243049}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
nav{position:fixed;inset:0 auto 0 0;width:62px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:calc(8px + env(safe-area-inset-top)) 4px calc(8px + env(safe-area-inset-bottom));z-index:5;overflow-y:auto}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:10px;color:var(--mut);text-align:center;line-height:1.15}
nav button b{font-size:20px;font-weight:400}
nav button.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700}
nav .sp{flex:1}
#dot{width:9px;height:9px;border-radius:50%;background:#16a34a;margin:6px auto 2px}
#dot.off{background:#f59e0b}
#dot.err{background:#dc2626}
#stage{position:fixed;inset:0 0 0 62px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
#home,#soon{position:absolute;inset:0;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));display:none}
#home.on,#soon.on{display:block}
.w{max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px}
.hero{margin:14px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,#0284c7,#7c3aed);color:#fff}
.hero small{opacity:.85}.hero .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.t{all:unset;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.t h3{margin:0 0 6px;font-size:.95rem}
.t .v{font-size:1.2rem;font-weight:700}
.t .m{color:var(--mut);font-size:12px;margin-top:4px}
.up{color:var(--up)}.dn{color:var(--dn)}
.t.soon{opacity:.65}
.sw{display:inline-flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;margin-bottom:8px}.sw button{all:unset;cursor:pointer;padding:5px 16px;border-radius:999px;font-size:13px;font-weight:600}.sw button.on{background:#fff;color:#0284c7}
.cf{display:block;margin-top:14px;font-size:13px;color:var(--mut)}.cf input{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
#sy{margin-top:14px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="stage">
  <div id="home"><div class="w">
    <h1>Mon patrimoine</h1><div class="sub" id="date"></div>
    <div class="hero"><div class="sw" id="sw"><button data-m="brut">Brut</button><button data-m="net">Net</button></div><div class="n" id="tot">–</div><small id="totsub"></small></div>
    <div class="g" id="tiles"></div>
    <label class="cf">🏡 Valeur estimée de mon bien immobilier (€)<input id="immo" type="number" inputmode="decimal" min="0" placeholder="0"></label>
    <div id="sy"></div>
  </div></div>
  <div id="soon"><div class="w"><h1 id="sn"></h1><p class="sub">Ce module n'est pas encore branché. Il apparaîtra ici avec le même fonctionnement hors connexion.</p></div></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const LS={g(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const eur=n=>(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const MODS=[
 {id:'home',ic:'🏠',lb:'Général'},
 {id:'depenses',ic:'💸',lb:'Dépenses',src:'depenses.html?m=dep'},
 {id:'salaire',ic:'💼',lb:'Salaire',src:'depenses.html?m=salaire'},
 {id:'pea',ic:'📈',lb:'PEA',src:'pea.html'},
 {id:'cto',ic:'🏦',lb:'CTO',src:'cto.html'},
 {id:'epargne',ic:'🎁',lb:'Épargne salariale',src:'depenses.html?m=epargne'},
 {id:'immo',ic:'🏡',lb:'Immobilier',src:'depenses.html?m=immo'},
 {id:'crypto',ic:'₿',lb:'Crypto'},
 {id:'sante',ic:'🩺',lb:'Santé',src:'depenses.html?m=sante'}
];
let cur='home';
const nav=$('#nav');
nav.innerHTML=MODS.map(m=>`<button data-id="${m.id}"><b>${m.ic}</b>${m.lb}</button>`).join('')+'<div class="sp"></div><div id="dot" title="Synchronisation"></div>';
nav.onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.id)};
function go(id){
  if(!MODS.some(m=>m.id===id))id='home';
  cur=id;if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  const m=MODS.find(x=>x.id===id);
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  $('#home').classList.toggle('on',id==='home');
  $('#soon').classList.toggle('on',!m.src&&id!=='home');
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.dataset.id===id));
  if(id==='home')renderHome();
  else if(!m.src)$('#sn').textContent=m.ic+' '+m.lb;
  else if(!document.querySelector(`iframe[data-id="${id}"]`)){
    const f=document.createElement('iframe');f.dataset.id=id;if(m.src.startsWith('depenses'))f.dataset.dep=1;f.src=m.src;f.className='on';$('#stage').appendChild(f);
  }
}
addEventListener('hashchange',()=>go(location.hash.slice(1)));

/* ---------- Page générale ---------- */
function depMois(){
  const D=LS.g('depenses_v1')||{},ym=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,7);
  const REV=['Salaire','Prime / Remboursement','Virement reçu'];let r=0,d=0;
  (D.depenses||[]).forEach(o=>{if(!(o.date||'').startsWith(ym))return;const rev=o.sens?o.sens==='Revenu':REV.includes(o.categorie);rev?r+=o.montant:d+=o.montant});
  return{r,d,n:(D.depenses||[]).length};
}
function crdPrets(D){const T=new Date(),P=(D.prets||[]).filter(p=>p.date_debut&&p.capital);let crd=0;
  P.forEach(p=>{const n=Math.round(p.duree)||240,i=p.taux/1200,k=Math.max(0,Math.min(n,(T.getFullYear()-+p.date_debut.slice(0,4))*12+T.getMonth()+1-+p.date_debut.slice(5,7)));
    crd+=i>0?p.capital*(Math.pow(1+i,n)-Math.pow(1+i,k))/(Math.pow(1+i,n)-1):p.capital*(1-k/n)});
  return{crd,n:P.length}}
const CF={get v(){return LS.g('hub_cfg')||{mode:'brut',immo:0}},set v(x){LS.s('hub_cfg',x)}};
function epargne(D){const L=(D.interessement||[]).filter(s=>s.date),P=s=>String(s.dest||'').startsWith('Placé'),tp=L.filter(P).reduce((a,s)=>a+(s.montant||0),0),tc=L.filter(s=>!P(s)).reduce((a,s)=>a+(s.montant||0),0),sv=D.solde_epargne,tr=(D.retraits_epargne||[]).reduce((a,r)=>a+(r.montant||0),0);
  return{n:L.length,tp,tc,tr,cur:sv&&sv.valeur>=0?sv.valeur:Math.max(0,tp-tr)}}
function renderHome(){
  $('#date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const p=LS.g('hub_pea'),dm=depMois(),D=LS.g('depenses_v1')||{},ds=[...(D.salaires||[])].filter(s=>s.date).sort((x,y)=>x.date<y.date?1:-1)[0],
    de=epargne(D),di=crdPrets(D),cf=CF.v;
  const ct=LS.g('hub_cto'),brut=(p?p.total:0)+(ct?ct.total:0)+de.cur+(cf.immo||0),net=brut-di.crd,net_=cf.mode==='net';
  $('#tot').textContent=eur(net_?net:brut);
  document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.m===(net_?'net':'brut')));
  if(document.activeElement!==$('#immo'))$('#immo').value=cf.immo||'';
  $('#totsub').textContent=(p?'':'PEA non chargé (ouvre l’onglet PEA une fois) · ')+'PEA '+eur(p?p.total:0)+(ct?' · CTO '+eur(ct.total):'')+' · Épargne salariale '+eur(de.cur)+' · Immobilier '+eur(cf.immo||0)+(net_?' − prêts ≈ '+eur(di.crd):'');
  const cl=v=>v>0?'up':v<0?'dn':'';
  const T=[
   ['depenses','💸','Dépenses (ce mois)',`<div class="v dn">−${eur(dm.d)}</div><div class="m">Revenus ${eur(dm.r)} · solde <span class="${cl(dm.r-dm.d)}">${eur(dm.r-dm.d)}</span></div>`],
   ['salaire','💼','Salaire',ds?`<div class="v">${eur(ds.net)}</div><div class="m">Dernier net avant impôts · ${new Date(ds.date+'T12:00:00').toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}</div>`:'<div class="m">Aucun salaire saisi</div>'],
   ['pea','📈','PEA',p?`<div class="v">${eur(p.total)}</div><div class="m">Gain <span class="${cl(p.gain)}">${eur(p.gain)}</span> · jour <span class="${cl(p.day)}">${eur(p.day)}</span></div>`:'<div class="m">Pas encore de données</div>'],
   ['cto','🏦','CTO',ct?`<div class="v">${eur(ct.total)}</div><div class="m">Gain <span class="${cl(ct.gain)}">${eur(ct.gain)}</span> · jour <span class="${cl(ct.day)}">${eur(ct.day)}</span></div>`:'<div class="m">Pas encore de données</div>'],
   ['epargne','🎁','Épargne salariale',de.n?`<div class="v">${eur(de.cur)}</div><div class="m">Sur le compte · retiré ${eur(de.tr)} · perçu ${eur(de.tc)}</div>`:'<div class="m">Aucun versement saisi</div>'],
   ['immo','🏡','Immobilier',di.n?`<div class="v">≈ ${eur(di.crd)}</div><div class="m">Capital restant dû · ${di.n} prêt${di.n>1?'s':''}</div>`:'<div class="m">Aucun prêt saisi</div>'],
   ['crypto','₿','Crypto','<div class="m">À venir</div>'],
   ['sante','🩺','Santé','<div class="m">Remboursements et suivi</div>']];
  $('#tiles').innerHTML=T.map(([id,ic,t,b])=>`<button class="t${b.includes('À venir')?' soon':''}" data-go="${id}"><h3>${ic} ${t}</h3>${b}</button>`).join('');
  $('#sw').onclick=e=>{const b=e.target.closest('button');if(b){CF.v={...CF.v,mode:b.dataset.m};renderHome()}};
  $('#immo').onchange=e=>{CF.v={...CF.v,immo:Math.max(0,parseFloat(e.target.value)||0)};renderHome()};
  $('#tiles').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
}

/* ---------- Synchronisation des dépenses (Supabase, table app_storage, clé « depenses ») ----------
   Hors connexion : tout reste dans le navigateur. Au retour du réseau, envoi automatique des modifications.
   Réutilise la connexion saisie dans les Réglages du PEA (clé locale « sb »). Dernière modification gagnante. */
const DK='depenses_v1',KEY='depenses';
let M=LS.g('hub_dep')||{t:0,sync:0},busy=false,timer=null;
const sbs=()=>LS.g('sb')||{};
const dot=(c,t)=>{const d=$('#dot');d.className=c||'';d.title=t};
function setSy(t){$('#sy').textContent=t||''}
async function api(path,o={},tok){
  const s=sbs();const r=await fetch(s.url+path,{...o,headers:{apikey:s.key,'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{}),...(o.headers||{})}});
  const t=await r.text();if(!r.ok)throw new Error(t.slice(0,140)||r.status);return t?JSON.parse(t):null}
async function token(){
  let s=sbs();if(s.access&&s.exp>Date.now()/1000+60)return s.access;
  const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh})});
  LS.s('sb',{...s,access:j.access_token,refresh:j.refresh_token,uid:j.user.id,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)});
  return j.access_token}
function localData(){try{return JSON.parse(localStorage.getItem(DK))}catch{return null}}
async function sync(){
  const s=sbs();
  if(!(s.url&&s.refresh)){dot('err','Non connecté à Supabase : se connecter dans Réglages du PEA');setSy('Dépenses : sauvegarde locale uniquement (connexion Supabase à faire dans les Réglages du PEA).');return}
  if(!navigator.onLine){dot('off','Hors connexion — synchronisation au retour du réseau');setSy('Hors connexion : les modifications sont gardées et seront envoyées au retour du réseau.');return}
  if(busy)return;busy=true;
  try{
    const tk=await token(),uid=sbs().uid;
    const j=await api(`/rest/v1/app_storage?select=value&key=eq.${KEY}&user_id=eq.${uid}`,{},tk);
    const rem=j&&j[0]&&j[0].value,rt=rem&&rem.t||0,loc=localData(),hasLoc=!!(loc&&(loc.depenses||[]).length);
    const dirty=M.t>M.sync;
    const push=async()=>{const t=M.t||Date.now();
      await api('/rest/v1/app_storage?on_conflict=user_id,key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,key:KEY,value:{t,data:loc||{}}})},tk);
      M={t,sync:t};LS.s('hub_dep',M)};
    const pull=()=>{localStorage.setItem(DK,JSON.stringify(rem.data));M={t:rt,sync:rt};LS.s('hub_dep',M);
      document.querySelectorAll('iframe[data-dep]').forEach(f=>f.contentWindow.location.reload())};
    if(!rem){if(hasLoc){if(!M.t)M.t=Date.now();await push()}}
    else if(M.sync===0&&hasLoc&&rt){ /* première synchro avec des données des deux côtés */
      if(confirm('Des dépenses existent sur cet appareil ET dans le cloud.\nOK = garder celles de cet appareil et écraser le cloud\nAnnuler = récupérer celles du cloud')){M.t=Date.now();await push()}else pull()}
    else if(dirty){if(M.t>=rt)await push();else{pull();setSy('Une version plus récente du cloud a remplacé vos modifications locales.')}}
    else if(rt>M.sync)pull();
    dot('','Synchronisé');setSy('Dépenses synchronisées le '+new Date().toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}));
  }catch(e){dot('err','Échec : '+e.message);setSy('Synchronisation impossible : '+e.message)}
  finally{busy=false;if(cur==='home')renderHome()}
}
const later=(ms=1500)=>{clearTimeout(timer);timer=setTimeout(sync,ms)};
addEventListener('storage',e=>{
  if(e.key===DK){M.t=Date.now();LS.s('hub_dep',M);later()}
  if((e.key==='hub_pea'||e.key==='hub_cto')&&cur==='home')renderHome()});
addEventListener('online',()=>{dot('','Reconnecté');later(500)});
addEventListener('offline',()=>dot('off','Hors connexion'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)later(500)});
setInterval(()=>{if(!document.hidden)sync()},60000);

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
go(location.hash.slice(1)||'home');
if(!navigator.onLine)dot('off','Hors connexion');
later(800);
</script>
</body>
</html>
